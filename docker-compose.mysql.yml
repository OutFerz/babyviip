# Sobrecarga opcional para la evaluación con MySQL.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#
# En .env: DATABASE_ENGINE=mysql , MYSQL_HOST=mysql_db , MYSQL_PORT=3306
# MYSQL_ROOT_PASSWORD es obligatorio para la imagen oficial de MySQL.

services:
  mysql_db:
    image: mysql:8.0
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-babyviip_db}
      MYSQL_USER: ${DATABASE_USER:-admin}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-pass_seguro_123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_mysql_cambiar}
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 4s
      timeout: 4s
      retries: 30

  web:
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data:
